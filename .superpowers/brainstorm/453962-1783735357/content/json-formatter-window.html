<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON 格式化 · 窗口原型</title>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --line:#d9dee8; --text:#1d2635; --muted:#687487; --blue:#276ef1; --blue-soft:#eaf1ff; --danger:#c4383b; }
  * { box-sizing:border-box; } body { margin:0; padding:34px; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  .intro { max-width:1050px; margin:0 auto 18px; } h1 { font-size:21px; margin:0 0 4px; } .intro p { margin:0; color:var(--muted); }
  .window { max-width:1050px; margin:auto; background:var(--card); border:1px solid #cdd4df; border-radius:10px; box-shadow:0 18px 45px #27364b25; overflow:hidden; }
  .titlebar { height:48px; display:flex; align-items:center; justify-content:space-between; padding:0 17px; border-bottom:1px solid var(--line); font-weight:600; }
  .close { color:var(--muted); font-size:20px; }
  .toolbar { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .toolbar label { color:var(--muted); font-weight:600; } select { border:1px solid #b8c2d2; border-radius:6px; padding:7px 30px 7px 10px; background:#fff; color:var(--text); font:inherit; }
  .note { margin-left:auto; color:var(--muted); font-size:12px; } kbd { padding:1px 5px; border:1px solid #c6ceda; border-radius:3px; background:#f7f8fa; }
  .panes { display:grid; grid-template-columns:1fr 1fr; min-height:382px; }
  .pane { padding:14px 16px 16px; min-width:0; }.pane + .pane { border-left:1px solid var(--line); }
  .pane-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }.pane-title { font-size:13px; font-weight:700; }.secondary { border:0; background:transparent; color:var(--blue); font:inherit; cursor:pointer; padding:4px 0; }
  .editor { width:100%; height:304px; resize:none; outline:none; padding:12px; border:1px solid #c5cedc; border-radius:7px; background:#fbfcfe; color:#253149; font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
  .editor.output { background:#f7faff; color:#273b69; }.error { color:var(--danger); font-size:12px; margin-top:7px; }
  .footer { display:flex; align-items:center; padding:13px 16px; gap:9px; border-top:1px solid var(--line); background:#fcfdff; }.status { color:var(--muted); font-size:12px; margin-right:auto; }.button { border:1px solid #b9c3d3; border-radius:6px; padding:8px 13px; background:#fff; color:#28354a; font:inherit; font-weight:600; }.button.primary { border-color:var(--blue); background:var(--blue); color:white; }.hint { max-width:1050px; margin:14px auto; padding:11px 14px; border-radius:7px; background:var(--blue-soft); color:#2d548c; font-size:13px; }
  @media(max-width:720px){body{padding:15px}.panes{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.note{display:none}.toolbar{flex-wrap:wrap}}
</style>
</head>
<body>
  <div class="intro"><h1>JSON 格式化窗口</h1><p>托盘菜单「JSON」打开的初版交互原型：剪贴板与手动输入共用同一个处理流程。</p></div>
  <main class="window">
    <div class="titlebar"><span>JSON 格式化</span><span class="close">×</span></div>
    <div class="toolbar">
      <label for="mode">格式化方式</label>
      <select id="mode"><option>美化（2 空格缩进）</option><option>美化（4 空格缩进）</option><option>压缩为单行</option><option>转义为 JSON 字符串</option></select>
      <span class="note">输入后点击「格式化」，或按 <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
    </div>
    <div class="panes">
      <section class="pane"><div class="pane-head"><span class="pane-title">输入 JSON</span><button class="secondary">从剪贴板粘贴</button></div><textarea class="editor" aria-label="输入 JSON">{"name":"Copy Time Tray","version":"0.3.0","features":["time","snippets","json"]}</textarea></section>
      <section class="pane"><div class="pane-head"><span class="pane-title">格式化结果</span><button class="secondary">复制结果</button></div><textarea class="editor output" aria-label="格式化结果" readonly>{
  "name": "Copy Time Tray",
  "version": "0.3.0",
  "features": [
    "time",
    "snippets",
    "json"
  ]
}</textarea></section>
    </div>
    <div class="footer"><span class="status">准备就绪</span><button class="button">取消</button><button class="button primary">格式化</button><button class="button primary">复制结果</button></div>
  </main>
  <div class="hint">建议流程：打开窗口时自动读取剪贴板填入左栏；用户可改写输入内容、选择格式，再格式化与复制结果。JSON 无效时，保留输入并在下方标出解析错误位置。</div>
</body>
</html>
