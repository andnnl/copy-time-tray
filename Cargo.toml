[package]
name = "copy-time-tray"
version = "0.3.0"
edition = "2021"
description = "跨平台托盘时钟 - 点击复制时间到剪贴板"

[[bin]]
name = "copy-time-tray"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
notify-rust = "4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libappindicator = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.4"
tray-icon = "0.24"
muda = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.24"
muda = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
