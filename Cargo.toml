[package]
name = "copy-time-tray"
version = "0.3.0"
edition = "2021"
description = "跨平台托盘时钟 - 点击复制时间到剪贴板"

[[bin]]
name = "copy-time-tray"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
notify-rust = "4"
rand = "0.8"
md-5 = "0.10"

# Snippet feature - 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Snippet feature - HTTP 客户端
reqwest = { version = "0.12", features = ["blocking", "json"] }

# Snippet feature - 工具库
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
crossbeam-channel = "0.5"
thiserror = "2"
directories = "6"
dirs = "5"
log = "0.4"
async-channel = "2"

# Snippet feature - GUI
egui = "0.29"
eframe = "0.29"
global-hotkey = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libappindicator = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
arboard = "3.4"
tray-icon = "0.24"
muda = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.24"
muda = "0.19"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
